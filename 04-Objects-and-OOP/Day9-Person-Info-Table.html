<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض معلومات الأشخاص</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 50%;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #6200ea;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>
    <script>
        // Collect and validate user information. Cancel safely exits the exercise.
        function askForInteger(message, min, max) {
            while (true) {
                const input = prompt(message);
                if (input === null) return null;

                const value = input.trim();
                if (/^\\d+$/.test(value)) {
                    const number = Number(value);
                    if (number >= min && (max === null || number <= max)) return number;
                }
                alert(max === null
                    ? `Please enter a whole number greater than or equal to ${min}.`
                    : `Please enter a whole number between ${min} and ${max}.`);
            }
        }

        function askForName(index) {
            while (true) {
                const name = prompt(`اكتب اسم الشخص رقم ${index} (من 4 لـ 9 حروف):`);
                if (name === null) return null;
                const cleanName = name.trim();
                if (cleanName.length >= 4 && cleanName.length <= 9) return cleanName;
                alert("الاسم لازم يكون من 4 لـ 9 حروف.");
            }
        }

        const numOfPersons = askForInteger("اكتب عدد الأشخاص اللي عايز تدخلهم (رقم صحيح أكبر من 0):", 1, null);

        if (numOfPersons !== null) {
            const users = [];
            let cancelled = false;

            for (let i = 0; i < numOfPersons; i++) {
                const name = askForName(i + 1);
                if (name === null) {
                    cancelled = true;
                    break;
                }

                const age = askForInteger(`اكتب عمر الشخص رقم ${i + 1} (بين 11 و 59):`, 11, 59);
                if (age === null) {
                    cancelled = true;
                    break;
                }
                users.push({ name, age });
            }

            if (!cancelled) {
                const table = document.createElement("table");
                const header = table.insertRow();
                ["الاسم", "العمر"].forEach(label => {
                    const cell = document.createElement("th");
                    cell.textContent = label;
                    header.appendChild(cell);
                });

                users.forEach(user => {
                    const row = table.insertRow();
                    const nameCell = row.insertCell();
                    const ageCell = row.insertCell();
                    nameCell.textContent = user.name;
                    ageCell.textContent = String(user.age);
                });

                document.body.appendChild(table);
            } else {
                document.body.textContent = "تم إلغاء إدخال البيانات.";
            }
        } else {
            document.body.textContent = "تم إلغاء إدخال البيانات.";
        }
    </script>
</body>
</html>
